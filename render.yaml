# Render Blueprint: one free web service running the game server.
# In Render: New + > Blueprint > pick this repository. See docs/HOSTING.md.
services:
  - type: web
    name: one-king-one-crown
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Render sits in front of the app as a proxy; trust it for the real visitor address
      - key: TRUST_PROXY
        value: "1"
