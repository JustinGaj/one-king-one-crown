<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>One King One Crown</title>
  <meta name="description" content="Play One King One Crown online with friends — a social manipulation card game of scheming, betrayal and gold.">
  <link rel="icon" href="/art/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- HOME -->
  <section id="home" class="screen">
    <div class="home-card">
      <div class="logo">
        <div class="logo-text">ONE KING<br>ONE CROWN</div>
        <div class="logo-crown" aria-hidden="true"><span></span><span></span></div>
      </div>
      <p class="tag">Scheme. Betray. Take the throne.<br><span>There’s only One Crown.</span></p>
      <label class="field">Your name<input id="name" maxlength="20" autocomplete="nickname" placeholder="e.g. Lady Layla"></label>
      <button id="create" class="btn primary">Create a game</button>
      <div class="or">or join a friend</div>
      <div class="row">
        <input id="code" maxlength="4" placeholder="CODE" autocomplete="off" spellcheck="false">
        <button id="join" class="btn">Join</button>
      </div>
      <p id="home-error" class="error" role="alert"></p>
      <button class="link" data-action="rules">How to play</button>
    </div>
    <footer class="credit">Fan-made online edition of <a href="https://onecrown.store/" target="_blank" rel="noopener">One King One Crown</a> — used under CC BY-NC-SA 4.0. Not for sale. Buy the real game at onecrown.store.</footer>
  </section>

  <!-- LOBBY -->
  <section id="lobby" class="screen hidden">
    <div class="lobby-card">
      <h1>Room <span id="room-code" class="code"></span></h1>
      <p class="muted">Send your friends the code or this link: <button id="copy-link" class="link">Copy invite link</button></p>
      <ul id="members" class="members"></ul>
      <div id="host-controls" class="host-controls">
        <button id="add-bot" class="btn">+ Add bot</button>
        <label class="inline">Negotiation timer
          <select id="neg-seconds">
            <option value="120">2 minutes (official)</option>
            <option value="90">90 seconds</option>
            <option value="60">60 seconds</option>
            <option value="30">30 seconds</option>
            <option value="0">Skip negotiation</option>
          </select>
        </label>
        <button id="start" class="btn primary">Start game</button>
      </div>
      <p id="lobby-wait" class="muted"></p>
      <p id="lobby-error" class="error" role="alert"></p>
      <div class="lobby-chat">
        <div id="lobby-chat-log" class="chat-log"></div>
        <form class="chat-form" data-chat><input maxlength="300" placeholder="Say something…"><button class="btn">Send</button></form>
      </div>
      <div class="row"><button id="leave" class="link">Leave room</button><button class="link" data-action="rules">How to play</button></div>
    </div>
  </section>

  <!-- GAME -->
  <section id="game" class="screen hidden">
    <header class="topbar">
      <div class="brand">ONE KING ONE CROWN</div>
      <div id="tracker" class="tracker"></div>
      <div id="phase" class="phase"></div>
      <div class="top-actions">
        <button id="skip" class="btn small hidden" title="Answer every open question with its default">Skip waiting</button>
        <button id="auto-me" class="btn small" title="Let the computer play for you">Autopilot</button>
        <button class="btn small" data-action="rules">Rules</button>
        <span class="code small" id="game-code"></span>
      </div>
    </header>
    <div class="layout">
      <main class="table-wrap">
        <div id="table" class="table">
          <div id="center" class="center"></div>
        </div>
      </main>
      <aside class="side">
        <div class="tabs"><button class="tab active" data-tab="log">Table log</button><button class="tab" data-tab="chat">Chat <span id="chat-badge" class="badge hidden"></span></button></div>
        <div id="log" class="log pane"></div>
        <div id="chat" class="pane hidden">
          <div id="chat-log" class="chat-log"></div>
          <form class="chat-form" data-chat><input maxlength="300" placeholder="Scheme here (everyone can read it)…"><button class="btn">Send</button></form>
        </div>
      </aside>
    </div>
    <section class="me-bar">
      <div id="me-info" class="me-info"></div>
      <div id="hand" class="hand"></div>
    </section>
    <div id="neg" class="neg hidden"></div>
    <div id="prompt" class="prompt hidden" role="dialog" aria-live="polite"></div>
  </section>

  <div id="modal" class="modal hidden" role="dialog"><div class="modal-box" id="modal-box"></div></div>
  <div id="toast" class="toast hidden" role="status"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
